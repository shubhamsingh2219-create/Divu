<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffd1e8" />
  <title>Happy Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- birthday song -->
  <audio id="song" src="the_mountain-happy-birthday-576570.mp3" loop preload="auto"></audio>

  <!-- celebrity voice player (source set on tap) -->
  <audio id="celebAudio" preload="none"></audio>

  <!-- music toggle -->
  <button id="musicToggle" class="music-btn" aria-label="Toggle music" title="Music">
    <span class="music-icon">🎵</span>
  </button>

  <!-- background layer: stars + nebula (behind the card) -->
  <canvas id="bg"></canvas>

  <!-- ambient glowing aura -->
  <div class="aura aura-1"></div>
  <div class="aura aura-2"></div>
  <div class="aura aura-3"></div>

  <main class="stage">
    <div class="orb" aria-hidden="true">
      <img class="orb-photo" src="div.jpg" alt="Divyanshi" />
    </div>

    <p class="eyebrow">🎉 Happy Birthday 🎈</p>
    <h1 id="name" class="name">Divyanshi</h1>

    <p id="message" class="message">
      Wishing you a day as bright as you are. Here's to more laughter,
      more adventures, and a year that treats you exactly the way you deserve.
    </p>

    <button id="surprise" class="btn">
      <span>Reveal a wish</span>
    </button>
    <p id="surpriseText" class="surprise-text"></p>

    <!-- Where is my cake -->
    <div class="action-row">
      <a id="cakeBtn" class="btn btn-cake" href="https://zoma.to/t/bOLdkJze" target="_blank" rel="noopener">
        <span>Where is my cake? 🎂</span>
      </a>
    </div>

    <!-- Celebrity voice wishes -->
    <div class="celeb-section">
      <p class="celeb-title">🎤 Celebrity wishes for you</p>
      <div class="celeb-grid">
        <button class="btn btn-celeb" data-src="Shah Ruk Khan.m4a.mp4">
          <span>▶ Shah Rukh Khan</span>
        </button>
        <button class="btn btn-celeb" data-src="Amitab Bacchan.m4a.mp4">
          <span>▶ Amitabh Bachchan</span>
        </button>
        <button class="btn btn-celeb" data-src="Nana Patekar.m4a.mp4">
          <span>▶ Nana Patekar</span>
        </button>
        <button class="btn btn-celeb" data-src="Sunil Shetty.m4a.mp4">
          <span>▶ Sunil Shetty</span>
        </button>
        <button class="btn btn-celeb" data-src="Mithoon.m4a.mp4">
          <span>▶ Mithoon</span>
        </button>
        <button class="btn btn-celeb" data-src="Guddu Pandit.m4a.mp4">
          <span>▶ Guddu Pandit</span>
        </button>
      </div>
    </div>

    <!-- Surprise gift: hand-made painting -->
    <div class="action-row">
      <button id="giftBtn" class="btn btn-gift">
        <span>See your surprise gift 🎁</span>
      </button>
    </div>

    <!-- Want more surprise -->
    <div class="action-row">
      <button id="moreBtn" class="btn btn-more">
        <span>Want more surprise? 🎁</span>
      </button>
    </div>

    <!-- Yes / Of course yes options (hidden until asked) -->
    <div id="choiceRow" class="choice-row" hidden>
      <button class="btn btn-choice" data-choice="yes"><span>Yes</span></button>
      <button class="btn btn-choice" data-choice="ofcourse"><span>Of course yes 💖</span></button>
    </div>

    <p id="finalMessage" class="final-message"></p>
  </main>

  <!-- foreground layer: balloons + glitter + wishes (above the card, tappable) -->
  <canvas id="fx"></canvas>

  <!-- Surprise gift overlay -->
  <div id="giftOverlay" class="gift-overlay" hidden>
    <button id="giftClose" class="gift-close" aria-label="Close">✕</button>
    <figure class="gift-figure">
      <img src="Paint.jpeg" alt="A portrait of Divyanshi, hand-made" class="gift-img" />
      <figcaption class="gift-caption">Made with love, just for you 💛</figcaption>
    </figure>
  </div>

  <script src="script.js"></script>
</body>
</html>
